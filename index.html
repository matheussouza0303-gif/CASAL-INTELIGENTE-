}

/* ---------- HISTÓRICO ---------- */
function vHistorico() {
  const todos = E.mesesComDados(S.lancs, S.meses, S.hoje);
  const anos = [...new Set([...todos.map((m) => m.slice(0, 4)), S.hoje.slice(0, 4)])].sort();
  const meses = []; for (let i = 1; i <= 12; i++) { const m = `${S.histAno}-${String(i).padStart(2, "0")}`; if (m <= E.mesDe(S.hoje) && (todos.includes(m) || m === E.mesDe(S.hoje))) meses.push(m); }
  const rs = meses.map((m) => ({ m, r: calc(m, S.histPessoa) })).map(({ m, r }) => ({ m, rec: r.estado === "passado" ? r.recebido : r.recebido, desp: r.estado === "passado" ? r.despesasTotal : r.despesasPagas, inv: r.aporteRealizado, r }));
  rs.forEach((x) => (x.eco = x.rec - x.desp));
  const maxR = rs.reduce((a, x) => (x.rec > (a ? a.rec : -1) ? x : a), null), maxD = rs.reduce((a, x) => (x.desp > (a ? a.desp : -1) ? x : a), null);
  const soma = (k) => rs.reduce((a, x) => a + x[k], 0);
  return `<div class="top"><h1>Histórico</h1><div class="flex">
    <select class="inp" id="selAno" style="width:auto;padding:8px 10px">${anos.map((a) => `<option ${a === S.histAno ? "selected" : ""}>${a}</option>`).join("")}</select>
    <div class="seg">${[null, ...pessoas()].map((p) => `<button data-hp="${p || ""}" class="${S.histPessoa === p ? "on" : ""}">${p || "Casal"}</button>`).join("")}</div></div></div>
  <div class="grid g2 g4">
    <div class="card"><div class="lbl">Recebido no ano</div><div class="big num pos">${fmt(soma("rec"))}</div></div>
    <div class="card"><div class="lbl">Gasto no ano</div><div class="big num">${fmt(soma("desp"))}</div></div>
    <div class="card"><div class="lbl">Investido no ano</div><div class="big num">${fmt(soma("inv"))}</div></div>
    <div class="card"><div class="lbl">Acumulado (receitas − despesas)</div><div class="big num ${soma("eco") < 0 ? "neg" : "pos"}">${fmt(soma("eco"))}</div></div>
  </div>
  <div class="grid g2" style="margin-top:12px">
    <div class="card"><div class="lbl">Mês de maior receita</div><div style="font-weight:600;margin-top:4px">${maxR && maxR.rec ? `${mesNome(maxR.m)} · ${fmt(maxR.rec)}` : "—"}</div></div>
    <div class="card"><div class="lbl">Mês de maior despesa</div><div style="font-weight:600;margin-top:4px">${maxD && maxD.desp ? `${mesNome(maxD.m)} · ${fmt(maxD.desp)}` : "—"}</div></div>
  </div>
  <div class="h2"><h2>Evolução</h2><small>receitas, despesas e investimentos</small></div>
  <div class="card"><div class="chartbox"><canvas id="chHist"></canvas></div></div>
  <div class="h2"><h2>Mês a mês</h2><small>toque para abrir o mês</small></div>
  <div class="card scroll-x"><table><thead><tr><th>Mês</th><th>Receitas</th><th>Despesas</th><th>Investido</th><th>Economizado</th><th>Taxa de poupança</th></tr></thead><tbody>
    ${rs.map((x) => `<tr class="${x === maxR ? "best" : ""}" data-irmes="${x.m}" style="cursor:pointer"><td>${mesNome(x.m)}${x.r.estado === "atual" ? ' <span class="tag">em andamento</span>' : ""}</td><td class="num">${fmt(x.rec)}</td><td class="num">${fmt(x.desp)}</td><td class="num">${fmt(x.inv)}</td><td class="num ${x.eco < 0 ? "neg" : ""}">${fmt(x.eco)}</td><td class="num">${x.rec ? pct((x.inv + Math.max(0, x.eco - x.inv)) / x.rec) : "—"}</td></tr>`).join("")}
  </tbody></table></div>
  <p class="sub" style="margin-top:10px">Meses passados mostram o realizado. O mês atual mostra apenas o que já foi recebido e pago. Nenhum dado é apagado ao virar o mês.</p>`;
}
function chartsHistorico() {
  const meses = []; for (let i = 1; i <= 12; i++) { const m = `${S.histAno}-${String(i).padStart(2, "0")}`; if (m <= E.mesDe(S.hoje)) meses.push(m); }
  const rs = meses.map((m) => calc(m, S.histPessoa)); let acc = 0;
  grafico("chHist", { type: "bar", data: { labels: meses.map(mesCurto), datasets: [
    { label: "Receitas", data: rs.map((r) => r.recebido), backgroundColor: cor("--accent"), borderRadius: 5, maxBarThickness: 22, order: 2 },
    { label: "Despesas", data: rs.map((r) => (r.estado === "passado" ? r.despesasTotal : r.despesasPagas)), backgroundColor: cor("--neg"), borderRadius: 5, maxBarThickness: 22, order: 2 },
    { label: "Investimentos acumulados", type: "line", data: rs.map((r) => (acc += r.aporteRealizado)), borderColor: cor("--warn"), backgroundColor: cor("--warn"), tension: 0.3, pointRadius: 3, order: 1 }] } });
}
document.addEventListener("change", (e) => { if (e.target.id === "selAno") { S.histAno = e.target.value; agendarRender(); } });
document.addEventListener("click", (e) => {
  const h = e.target.closest("[data-hp]"); if (h) { S.histPessoa = h.dataset.hp || null; agendarRender(); }
  const t = e.target.closest("[data-irmes]"); if (t) { S.mes = t.dataset.irmes; S.pessoa = S.histPessoa; location.hash = "#inicio"; }
});

/* ---------- PATRIMÔNIO ---------- */
function vPatrimonio() {
  const P = S.patrimonio, ult = P[P.length - 1], ant = P[P.length - 2];
  const total = (x) => (x ? (x.conta || 0) + (x.reserva || 0) + (x.investimentos || 0) + (x.outros || 0) : 0);
  const varr = ult && ant ? total(ult) - total(ant) : null;
  return `<div class="top"><h1>Patrimônio</h1>${S.podeEscrever ? '<button class="btn sm" id="bPat">+ Atualizar saldos</button>' : ""}</div>
  ${ult ? `<div class="card hero" style="grid-template-columns:1fr"><div><div class="lbl">Patrimônio em ${fmtData(ult.data)}</div><div class="amount num">${fmt(total(ult))}</div>
    ${varr !== null ? `<span class="pill">Desde ${fmtData(ant.data)}: <b class="num ${varr < 0 ? "neg" : "pos"}">${varr >= 0 ? "+" : ""}${fmt(varr)}</b></span>` : ""}</div></div>
  <div class="grid g2 g4" style="margin-top:12px">${[["Saldo em conta", "conta"], ["Reservas", "reserva"], ["Investimentos", "investimentos"], ["Outros bens", "outros"]].map(([t, k]) => `<div class="card"><div class="lbl">${t}</div><div class="big num">${fmt(ult[k])}</div></div>`).join("")}</div>
  <div class="h2"><h2>Evolução do patrimônio</h2></div><div class="card"><div class="chartbox"><canvas id="chPat"></canvas></div></div>
  <div class="h2"><h2>Registros</h2></div><div class="card"><div class="rows">${P.slice().reverse().map((x) => `<div class="row click" data-pat="${esc(x.id)}"><div class="t"><b>${fmtData(x.data)}</b><span>${esc(x.obs || "")}</span></div><div class="v num">${fmt(total(x))}</div></div>`).join("")}</div></div>` :
  `<div class="card empty">Registre seus saldos de tempos em tempos (por exemplo, todo fim de mês): conta corrente, reservas, investimentos e outros bens. O gráfico mostra o crescimento ao longo do tempo.<br><br>${S.podeEscrever ? '<button class="btn" id="bPat">Fazer primeiro registro</button>' : ""}</div>`}`;
}
function chartsPatrimonio() {
  const P = S.patrimonio; if (!P.length) return;
  const ds = [["Conta", "conta", "--muted"], ["Reservas", "reserva", "--warn"], ["Investimentos", "investimentos", "--accent"], ["Outros", "outros", "--neg"]];
  grafico("chPat", { type: "line", data: { labels: P.map((x) => fmtData(x.data)), datasets: ds.map(([l, k, c]) => ({ label: l, data: P.map((x) => x[k] || 0), borderColor: cor(c), backgroundColor: cor(c) + "33", fill: true, tension: 0.3, pointRadius: 2 })) },
    options: { scales: { y: { stacked: true, ticks: { callback: (v) => fmtK(v) }, grid: { color: cor("--line") } }, x: { grid: { display: false } } } } });
}
document.addEventListener("click", (e) => {
  if (e.target.id === "bPat") editarPat();
  const p = e.target.closest("[data-pat]"); if (p && S.podeEscrever) editarPat(S.patrimonio.find((x) => x.id === p.dataset.pat));
});
function editarPat(x = null) {
  const base = x || S.patrimonio[S.patrimonio.length - 1] || {};
  const v = (n) => (n ? String(n).replace(".", ",") : "");
  abrirSheet(`<h3>${x ? "Editar registro" : "Atualizar saldos"}</h3><form id="fPat" class="formgrid">
    <div class="field full"><label>Data</label><input class="inp" type="date" name="data" value="${x ? x.data : S.hoje}"></div>
    ${[["Saldo em conta", "conta"], ["Reservas", "reserva"], ["Investimentos", "investimentos"], ["Outros bens", "outros"]].map(([t, k]) => `<div class="field"><label>${t}</label><input class="inp" inputmode="decimal" name="${k}" value="${v(base[k])}" placeholder="0,00"></div>`).join("")}
    <div class="field full"><label>Observação</label><input class="inp" name="obs" value="${esc(x ? x.obs || "" : "")}"></div>
    <div class="acts full">${x ? '<button type="button" class="btn danger" id="bDelP">Excluir</button>' : ""}<button type="button" class="btn ghost" id="bC">Cancelar</button><button class="btn">Salvar</button></div></form>`, (el) => {
    $("#bC", el).onclick = fecharSheet;
    if (x) $("#bDelP", el).onclick = async () => { if (!confirm("Excluir este registro?")) return; try { await S.db.doc("patrimonio/" + x.id).delete(); fecharSheet(); } catch (e) { falhaEscrita(e); } };
    $("#fPat", el).onsubmit = async (e) => {
      e.preventDefault(); const f = e.target;
      const d = { data: f.data.value || S.hoje, conta: E.parseValor(f.conta.value), reserva: E.parseValor(f.reserva.value), investimentos: E.parseValor(f.investimentos.value), outros: E.parseValor(f.outros.value), obs: f.obs.value.trim(), por: S.pessoaMe || "—", em: agoraISO() };
      try { if (x) await S.db.doc("patrimonio/" + x.id).set(d); else await S.db.collection("patrimonio").add(d); fecharSheet(); toast("Patrimônio atualizado"); } catch (e) { falhaEscrita(e); }
    };
  });
}

/* ---------- AJUSTES / MAIS ---------- */
function vMais() {
  const it = [["fixas", "🧾", "Despesas fixas", "Alterar valores, incluir ou retirar"], ["plano", "📋", "Planejamento", "Receitas, orçamento e fórmula do mês"], ["historico", "📊", "Histórico", "Comparar meses e anos"], ["patrimonio", "🏛️", "Patrimônio", "Saldos, reservas e investimentos"], ["ajustes", "⚙️", "Ajustes", "Tema, perfil e exportação"]];
  return `<div class="top"><h1>Mais</h1></div><div class="card"><div class="rows">${it.map(([h, i, t, s]) => `<a class="row click" href="#${h}" style="text-decoration:none;color:inherit"><div class="lft"><div class="ico">${i}</div><div class="t"><b>${t}</b><span>${s}</span></div></div><span class="muted">›</span></a>`).join("")}</div></div>`;
}
function vAjustes() {
  const tema = document.documentElement.dataset.theme || "auto";
  const outraPessoa = S.pessoaMe === "Matheus" ? "Letícia" : "Matheus";
  const convite = S.householdRole === "owner" ? `<div class="h2"><h2>Compartilhar com ${outraPessoa}</h2></div>
    <div class="card stack"><p class="sub" style="margin:0">A outra pessoa precisa ter uma conta criada no Supabase. Digite o mesmo e-mail usado no login dela para liberar o acesso aos dados do casal.</p>
      <label class="field"><span>E-mail da outra pessoa</span><input class="inp" type="email" id="inviteEmail" placeholder="email@exemplo.com" autocomplete="email"></label>
      <button class="btn" id="inviteMember">Vincular ${outraPessoa}</button></div>` : "";
  return `<div class="top"><h1>Ajustes</h1></div>
  <div class="card stack">
    <div class="flex"><div><b>Seu perfil</b><div class="sub">Acesso individual vinculado à sua conta</div></div><span class="spacer"></span><b>${esc(S.pessoaMe || "Usuário")}</b></div>
    <div class="flex"><div><b>Aparência</b><div class="sub">Modo escuro opcional</div></div><span class="spacer"></span>
      <div class="seg">${[["auto", "Sistema"], ["light", "Claro"], ["dark", "Escuro"]].map(([v, t]) => `<button data-tema="${v}" class="${tema === v ? "on" : ""}">${t}</button>`).join("")}</div></div>
  </div>
  ${convite}
  <div class="h2"><h2>Backup e exportação</h2></div>
  <div class="card stack"><p class="sub" style="margin:0">Faça backups completos periodicamente. O arquivo JSON contém planejamento, lançamentos, metas, patrimônio, histórico e marcações mensais compartilhadas entre os dois usuários.</p>
    <div class="flex"><button class="btn" id="bBackup">Backup completo (.json)</button><button class="btn ghost" id="bRestore">Restaurar backup</button></div>
    <input id="backupFile" type="file" accept="application/json,.json" hidden>
    <div class="flex"><button class="btn ghost" id="bXlsx">Exportar Excel (.xlsx)</button><button class="btn ghost" id="bCsv">Exportar lançamentos (.csv)</button></div></div>
  <div class="h2"><h2>Sobre os dados</h2></div>
  <div class="card"><p class="sub" style="margin:0">Dados sincronizados pelo Supabase e protegidos por autenticação e regras de acesso da família. Conta atual: ${esc(S.user?.email || "—")}. ${S.lancs.length} lançamentos · ${S.metas.length} metas · ${S.patrimonio.length} registros de patrimônio.</p>
  <div class="flex" style="margin-top:12px"><button class="btn ghost" id="signOut">Sair da conta</button></div></div>`;
}
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-tema]"); if (t) aplicarTema(t.dataset.tema === "auto" ? null : t.dataset.tema);
  if (e.target.id === "inviteMember") {
    const email = $("#inviteEmail")?.value.trim().toLowerCase();
    const outraPessoa = S.pessoaMe === "Matheus" ? "Letícia" : "Matheus";
    if (!email) { toast("Informe o e-mail da outra pessoa."); return; }
    e.target.disabled = true; e.target.textContent = "Vinculando…";
    try {
      const { error } = await S.supabase.rpc("add_household_member", { p_household_id: S.householdId, p_email: email, p_person_name: outraPessoa });
      if (error) throw error;
      toast(outraPessoa + " vinculada ao espaço do casal.");
      $("#inviteEmail").value = "";
    } catch (error) { toast(error.message || "Não foi possível vincular a conta."); }
    finally { e.target.disabled = false; e.target.textContent = "Vincular " + outraPessoa; }
  }
  if (e.target.id === "signOut") await S.supabase.auth.signOut();
  if (e.target.id === "bCsv") exportar("csv");
  if (e.target.id === "bXlsx") exportar("xlsx");
  if (e.target.id === "bBackup") {
    const data = JSON.stringify(S.db.exportAll(), null, 2);
    salvarArquivo(`casal-inteligente-backup-${S.hoje.replace(/-/g, "")}.json`, new Blob([data], { type: "application/json" }));
  }
  if (e.target.id === "bRestore") $("#backupFile")?.click();
});
document.addEventListener("change", (e) => {
  if (e.target.id !== "backupFile" || !e.target.files?.[0]) return;
  const file = e.target.files[0];
  if (!confirm("Restaurar este backup substituirá os dados locais atuais. Faça um backup antes. Deseja continuar?")) { e.target.value = ""; return; }
  const reader = new FileReader();
  reader.onload = () => {
    (async () => {
      try { await S.db.importAll(JSON.parse(reader.result)); toast("Backup restaurado com sucesso"); agendarRender(); }
      catch (err) { alert("Não foi possível restaurar o backup: " + (err.message || "arquivo inválido")); }
    })();
    e.target.value = "";
  };
  reader.onerror = () => { alert("Falha ao ler o arquivo de backup."); e.target.value = ""; };
  reader.readAsText(file);
});
function linhasExport() {
  return S.lancs.slice().sort((a, b) => a.data.localeCompare(b.data)).map((l) => ({
    Data: fmtData(l.data), Tipo: l.tipo, Pessoa: l.pessoa, "Origem/Categoria": l.origem || l.categoria || (S.metas.find((m) => m.id === l.metaId) || {}).nome || "",
    Descrição: l.descricao || "", Valor: l.valor, "Forma de pagamento": l.forma || "", Status: l.status || "", Observação: l.obs || "",
    Excluído: l.excluido ? "sim" : "", "Criado por": l.criadoPor || "", "Criado em": l.criadoEm ? new Date(l.criadoEm).toLocaleString("pt-BR") : "",
  }));
}
async function salvarArquivo(nome, dados) {
  try {
    const blob = dados instanceof Blob ? dados : new Blob([dados]);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast("Arquivo pronto para salvar");
  } catch (e) { toast("Não foi possível exportar o arquivo."); console.error(e); }
}
async function exportar(fmtArq) {
  const hojeTxt = S.hoje.replace(/-/g, "");
  const rows = linhasExport();
  if (fmtArq === "xlsx" && (!window.XLSX || !window.XLSX.utils)) {
    toast("A exportação Excel não carregou. Verifique a conexão com a internet ou exporte em CSV.");
    return;
  }
  if (fmtArq === "csv") {
    const cab = Object.keys(rows[0] || { Data: "" });
    const cel = (v) => { const s = typeof v === "number" ? v.toFixed(2).replace(".", ",") : String(v ?? ""); return /[";\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const csv = "\ufeff" + [cab.join(";"), ...rows.map((r) => cab.map((k) => cel(r[k])).join(";"))].join("\r\n");
    return salvarArquivo(`casal-inteligente-lancamentos-${hojeTxt}.csv`, new Blob([csv], { type: "text/csv" }));
  }
  if (!window.XLSX) { toast("Biblioteca de Excel não carregou; use o CSV."); return; }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{ Data: "" }]), "Lançamentos");
  const meses = E.mesesComDados(S.lancs, S.meses, S.hoje);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(meses.map((m) => { const r = calc(m, null); return { Mês: mesNome(m), "Receitas fixas": r.fixoPrevisto, "Fixas recebidas": r.fixoRecebido, "Receitas variáveis": r.varRecebida, "Total recebido": r.recebido, "Despesas fixas": r.fixasTotal, "Despesas variáveis": r.varTotal, "Despesas totais": r.despesasTotal, Investido: r.aporteRealizado, "Resultado/previsão": r.fechamento }; })), "Resumo mensal");
  const p = S.plano;
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([
    ...p.rendasFixas.map((x) => ({ Grupo: "Receita fixa", Nome: x.nome, Pessoa: x.pessoa, Valor: x.valor })),
    ...p.previsoesVariaveis.map((x) => ({ Grupo: "Previsão variável", Nome: x.origem, Pessoa: x.pessoa, Valor: x.valor })),
    ...p.despesasFixas.map((x) => ({ Grupo: "Despesa fixa", Nome: x.nome, Pessoa: x.responsavel, Valor: x.valor })),
    { Grupo: "Regra", Nome: "Despesas fixas", Valor: p.regra.fixas }, { Grupo: "Regra", Nome: "Lazer", Valor: p.regra.lazer }, { Grupo: "Regra", Nome: "Investimentos", Valor: p.regra.investimentos }]), "Planejamento");
  const pg = progressos();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(S.metas.length ? S.metas.map((m, i) => ({ Meta: m.nome, "Valor desejado": m.alvo, Acumulado: pg[i].acumulado, "% concluído": pg[i].pct, "Data limite": fmtData(m.prazo), "Aporte mensal": m.aporteMensal, Situação: pg[i].situacao })) : [{ Meta: "" }]), "Metas");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(S.patrimonio.length ? S.patrimonio.map((x) => ({ Data: fmtData(x.data), Conta: x.conta, Reservas: x.reserva, Investimentos: x.investimentos, Outros: x.outros, Total: (x.conta || 0) + (x.reserva || 0) + (x.investimentos || 0) + (x.outros || 0), Obs: x.obs })) : [{ Data: "" }]), "Patrimônio");
  const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  salvarArquivo(`casal-inteligente-${hojeTxt}.xlsx`, new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
}

/* ---------- render ---------- */
function render() {
  $$("[data-nav]").forEach((a) => a.classList.toggle("on", a.dataset.nav === S.view || (S.view !== "inicio" && S.view !== "movimentos" && S.view !== "metas" && a.dataset.nav === "mais" && a.closest(".tabbar"))));
  $$(".view").forEach((v) => v.classList.toggle("on", v.id === "v-" + S.view));
  $("#sideWho").textContent = S.pessoaMe ? "Conectado como " + S.pessoaMe : "";
  const el = $("#v-" + S.view);
  if (!S.plano) {
    el.innerHTML = `<div class="top"><h1>Casal Inteligente</h1></div><div class="card empty">${S.db ? (S.carregado.plano ? "O planejamento ainda não foi cadastrado neste painel." : "Carregando seus dados…") : "Aguardando os dados locais."}</div>`;
    return;
  }
  if (!S.podeEscrever && !$("#statusBanner").textContent) banner("Você tem acesso só de leitura. Peça a quem criou o painel para te dar permissão de Colaborador.");
  const fns = { inicio: [vInicio, chartsInicio], movimentos: [vMovimentos], plano: [vPlano, chartsPlano], fixas: [vFixas], metas: [vMetas], historico: [vHistorico, chartsHistorico], patrimonio: [vPatrimonio, chartsPatrimonio], ajustes: [vAjustes], mais: [vMais] };
  const [v, c] = fns[S.view];
  const y = window.scrollY;
  Object.values(S.charts).forEach((ch) => ch.destroy()); S.charts = {};
  el.innerHTML = v();
  if (c) c();
  window.scrollTo(0, y);
}
iniciar().catch((error) => { console.error(error); renderAuth(error.message || "Falha ao iniciar o Casal Inteligente."); });
</script>
<!-- Casal Inteligente: autenticação Supabase, dados familiares isolados por RLS e sincronização Realtime. -->
</body></html>
